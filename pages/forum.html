<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forum - LC Agora</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <i class="fas fa-graduation-cap logo-icon"></i>
                <span>LC Agora</span>
            </div>
            <nav>
                <ul class="nav-links">
                    <li><a href="../index.html">Home</a></li>
                    <li><a href="agenda.html">Agenda</a></li>
                    <li><a href="forum.html" class="active">Forum</a></li>
                    <li><a href="challenges.html">Challenges</a></li>
                    <li><a href="workshops.html">Workshops</a></li>
                    <li><a href="inspiratie.html">Inspiratie</a></li>
                    <li><a href="#" class="coach-only">Beheer</a></li>
                </ul>
            </nav>
            <div class="user-info logout-link">
                <span class="user-name"></span>
                <span class="user-role" style="font-size: 14px; opacity: 0.8;"></span>
                <button class="logout-btn">Uitloggen</button>
            </div>
            <div class="login-link">
                <a href="../login.html" class="btn btn-outline" style="color: white; border-color: white;">Inloggen</a>
            </div>
        </div>
    </header>
    
    <main class="main">
        <div class="container">
            <h1 class="page-title">Forum</h1>
            
            <div class="chat-container fade-in">
                <!-- Sidebar with chat list -->
                <div class="chat-sidebar">
                    <h3>
                        <i class="fas fa-comments"></i> Chats
                    </h3>
                    <ul class="chat-list">
                        <li data-chat-id="general" class="active">
                            <i class="fas fa-users"></i> Algemene mededelingen
                        </li>
                        <li data-chat-id="coaches">
                            <i class="fas fa-chalkboard-teacher"></i> Coaches
                        </li>
                        <li data-chat-id="challenges">
                            <i class="fas fa-trophy"></i> Challenges
                        </li>
                        <li data-chat-id="workshops">
                            <i class="fas fa-chalkboard"></i> Workshops
                        </li>
                        <li data-chat-id="private">
                            <i class="fas fa-user"></i> Privé chats
                        </li>
                    </ul>
                    
                    <div style="margin-top: 20px; padding-top: 20px; border-top: 1px solid #EEE;">
                        <h3 style="margin-bottom: 15px;">
                            <i class="fas fa-plus"></i> Nieuwe chat
                        </h3>
                        <form id="newChatForm">
                            <input type="text" placeholder="Gebruikersnaam..." style="width: 100%; padding: 8px; border: 1px solid #DDD; border-radius: 5px; margin-bottom: 10px;">
                            <button type="submit" class="btn btn-primary" style="width: 100%;">
                                <i class="fas fa-paper-plane"></i> Start chat
                            </button>
                        </form>
                    </div>
                </div>
                
                <!-- Main chat area -->
                <div class="chat-main">
                    <div class="chat-header">
                        <h2>
                            <i class="fas fa-users"></i> Algemene mededelingen
                        </h2>
                        <div>
                            <button class="btn btn-outline" id="refreshChatBtn">
                                <i class="fas fa-sync"></i>
                            </button>
                        </div>
                    </div>
                    
                    <div class="chat-messages" id="chatMessages">
                        <!-- Messages will be loaded here -->
                    </div>
                    
                    <form class="chat-input" id="chatInputForm">
                        <input type="text" placeholder="Typ een bericht..." id="messageInput" required>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-paper-plane"></i> Verzenden
                        </button>
                    </form>
                </div>
            </div>
            
            <!-- Announcements for coaches -->
            <div class="card fade-in mt-4 coach-only">
                <h2 style="color: var(--primary-color); margin-bottom: 20px;">
                    <i class="fas fa-bullhorn"></i> Mededeling plaatsen (Coaches)
                </h2>
                <form id="announcementForm">
                    <div class="form-group">
                        <label for="announcement-title">Titel</label>
                        <input type="text" id="announcement-title" required>
                    </div>
                    <div class="form-group">
                        <label for="announcement-message">Bericht</label>
                        <textarea id="announcement-message" rows="4" required></textarea>
                    </div>
                    <div class="form-group">
                        <label for="announcement-audience">Doelgroep</label>
                        <select id="announcement-audience">
                            <option value="all">Alle leerlingen</option>
                            <option value="specific">Specifieke leerlingen</option>
                        </select>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-paper-plane"></i> Mededeling plaatsen
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>
    
    <script src="../js/auth.js"></script>
    <script src="../js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Chat list click handlers
            const chatListItems = document.querySelectorAll('.chat-list li');
            chatListItems.forEach(item => {
                item.addEventListener('click', function() {
                    const chatId = this.dataset.chatId;
                    const chatName = this.textContent.trim();
                    
                    // Update chat header
                    const chatHeader = document.querySelector('.chat-header h2');
                    if (chatHeader) {
                        chatHeader.innerHTML = `<i class="fas fa-comments"></i> ${chatName}`;
                    }
                    
                    // Update active state
                    chatListItems.forEach(i => i.classList.remove('active'));
                    this.classList.add('active');
                    
                    // Load messages for this chat
                    loadChatMessages(chatId);
                });
            });
            
            // New chat form
            const newChatForm = document.getElementById('newChatForm');
            if (newChatForm) {
                newChatForm.addEventListener('submit', function(e) {
                    e.preventDefault();
                    const username = this.querySelector('input').value.trim();
                    if (username) {
                        alert(`Chat gestart met ${username}`);
                        this.reset();
                    }
                });
            }
            
            // Announcement form (coaches only)
            const announcementForm = document.getElementById('announcementForm');
            if (announcementForm) {
                announcementForm.addEventListener('submit', function(e) {
                    e.preventDefault();
                    const title = document.getElementById('announcement-title').value.trim();
                    const message = document.getElementById('announcement-message').value.trim();
                    
                    if (title && message) {
                        alert('Mededeling succesvol geplaatst!');
                        this.reset();
                    } else {
                        alert('Vul alstublieft een titel en bericht in');
                    }
                });
            }
        });
        
        function loadChatMessages(chatId) {
            const chatMessages = document.getElementById('chatMessages');
            if (!chatMessages) return;
            
            // Clear existing messages
            chatMessages.innerHTML = '';
            
            // Sample messages based on chat type
            const messages = {
                general: [
                    { sender: 'coach1', text: 'Welkom op het LC Agora forum! Hier kunnen jullie vragen stellen en met elkaar communiceren.', time: '09:00' },
                    { sender: 'leerling1', text: 'Hoi! Ik heb een vraag over mijn challenge.', time: '09:15' },
                    { sender: 'coach1', text: 'Stel je vraag maar, ik help je graag!', time: '09:20' }
                ],
                coaches: [
                    { sender: 'coach1', text: 'Hoi alle coaches, we hebben vandaag een vergadering om 14:00 uur.', time: '08:00' },
                    { sender: 'coach2', text: 'Noted! Ik ben er bij.', time: '08:05' }
                ],
                challenges: [
                    { sender: 'leerling2', text: 'Ik zoek medewerkers voor mijn challenge over duurzaamheid. Wie doet mee?', time: '10:00' },
                    { sender: 'leerling3', text: 'Ik doe mee! Stuur me maar een bericht.', time: '10:15' }
                ],
                workshops: [
                    { sender: 'coach2', text: 'De workshop over fruit plukken is verplaatst naar volgende week woensdag.', time: '11:00' },
                    { sender: 'leerling1', text: 'Bedankt voor de update!', time: '11:05' }
                ],
                private: [
                    { sender: 'leerling1', text: 'Hoi, heb je de opdracht voor de challenge al af?', time: '13:00' },
                    { sender: 'leerling2', text: 'Ja, ik ben bijna klaar. Ik stuur hem je zo.', time: '13:05' }
                ]
            };
            
            const chatMsgs = messages[chatId] || [];
            
            chatMsgs.forEach(msg => {
                const messageElement = document.createElement('div');
                messageElement.className = `message ${msg.sender === getCurrentUser()?.username ? 'sent' : 'received'}`;
                
                const info = document.createElement('div');
                info.className = 'message-info';
                
                const sender = document.createElement('span');
                sender.textContent = msg.sender;
                
                const time = document.createElement('span');
                time.textContent = msg.time;
                
                info.appendChild(sender);
                info.appendChild(time);
                
                const text = document.createElement('div');
                text.textContent = msg.text;
                
                messageElement.appendChild(info);
                messageElement.appendChild(text);
                
                chatMessages.appendChild(messageElement);
            });
            
            // Scroll to bottom
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
    </script>
</body>
</html>
