<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wachtwoord wijzigen - LC Agora</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-content">
                <div class="logo">
                    <i class="fas fa-graduation-cap logo-icon"></i>
                    <span>LC Agora</span>
                </div>
                <nav>
                    <ul class="nav-links">
                        <li><a href="index.html">Home</a></li>
                    </ul>
                </nav>
                <div class="user-info logout-link">
                    <span class="user-name"></span>
                    <button class="logout-btn">Uitloggen</button>
                </div>
            </div>
        </header>
        
        <main class="main">
            <div style="max-width: 500px; margin: 0 auto;">
                <h1 class="page-title">Wachtwoord wijzigen</h1>
                
                <div class="card fade-in">
                    <p style="margin-bottom: 20px; color: var(--text-dark);">
                        Dit is je eerste keer inloggen. Je moet je wachtwoord wijzigen voordat je toegang krijgt tot het platform.
                    </p>
                    
                    <form id="changePasswordForm">
                        <div class="form-group">
                            <label for="current-password">Huidig wachtwoord</label>
                            <input type="password" id="current-password" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="new-password">Nieuw wachtwoord</label>
                            <input type="password" id="new-password" required minlength="8">
                            <small style="color: var(--text-light);">Minimaal 8 tekens</small>
                        </div>
                        
                        <div class="form-group">
                            <label for="confirm-password">Bevestig nieuw wachtwoord</label>
                            <input type="password" id="confirm-password" required>
                        </div>
                        
                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary">Wachtwoord wijzigen</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>
    
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const changePasswordForm = document.getElementById('changePasswordForm');
            
            changePasswordForm.addEventListener('submit', function(e) {
                e.preventDefault();
                
                const currentPassword = document.getElementById('current-password').value;
                const newPassword = document.getElementById('new-password').value;
                const confirmPassword = document.getElementById('confirm-password').value;
                
                const result = changePassword(currentPassword, newPassword, confirmPassword);
                
                if (result.success) {
                    alert(result.message);
                    window.location.href = 'index.html';
                } else {
                    alert(result.message);
                }
            });
        });
    </script>
</body>
</html>
