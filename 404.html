<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="3; url=login.html">
    <title>Pagina niet gevonden - LC Agora</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div style="text-align: center; padding: 50px 20px;">
        <div class="login-logo" style="width: 100px; height: 100px; margin: 0 auto 20px; background: var(--primary-color); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 40px;">
            <i class="fas fa-graduation-cap"></i>
        </div>
        
        <h1 style="color: var(--primary-color); font-size: 2rem; margin-bottom: 20px;">
            LC Agora
        </h1>
        
        <div class="card" style="max-width: 500px; margin: 0 auto; text-align: center;">
            <h2 style="color: var(--danger); margin-bottom: 20px;">
                <i class="fas fa-exclamation-triangle"></i> Pagina niet gevonden
            </h2>
            <p style="color: var(--text-dark); line-height: 1.8; margin-bottom: 20px;">
                De pagina die je probeert te openen bestaat niet of is verplaatst.
                <br>
                Je wordt automatisch doorgestuurd naar de inlogpagina.
            </p>
            <p style="color: var(--text-light); font-size: 14px;">
                <i class="fas fa-clock"></i> Doorverwijzen over <span id="countdown">3</span> seconden...
            </p>
            <a href="login.html" class="btn btn-primary" style="display: inline-block; margin-top: 15px;">
                <i class="fas fa-sign-in-alt"></i> Direct naar inloggen
            </a>
        </div>
    </div>
    
    <script>
        let countdown = 3;
        const countdownElement = document.getElementById('countdown');
        
        const timer = setInterval(function() {
            countdown--;
            if (countdownElement) {
                countdownElement.textContent = countdown;
            }
            
            if (countdown <= 0) {
                clearInterval(timer);
                window.location.href = 'login.html';
            }
        }, 1000);
    </script>
</body>
</html>
